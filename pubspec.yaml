name: asistanim
description: "Kişisel Sekreter AI – not alır, hatırlatır, süreçleri yürütür."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Depolama
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5

  # Yerel bildirimler
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0

  # Güvenli depo (API anahtarı)
  flutter_secure_storage: ^9.2.4

  # Kamera / galeri
  image_picker: ^1.1.2

  # Metin okuma (TTS)
  flutter_tts: ^4.2.2

  # Yedekleme: dosya paylaşımı ve seçimi
  share_plus: ^11.0.0
  file_picker: ^8.3.7

  # Claude API (doğrudan HTTPS)
  http: ^1.2.2

  # Navigasyon
  go_router: ^14.8.1

  # Tarih/saat seçici (Material widget'ları yeterli; ek paket gerekmiyor)
  intl: ^0.19.0
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true
